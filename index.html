function persist(){if(!storageOK)return;try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){storageOK=false;notify('保存失败：请先导出备份')}}
function words(){const m=new Map;for(const w of [...BUILT_IN_WORDS,...data.custom])m.set(w.word.toLowerCase(),w);return [...m.values()]}
function getWord(word){return words().find(w=>w.word===word)}
function filteredWords(){return words().filter(w=>(data.settings.pack==='全部'||w.pack===data.settings.pack)&&levelPass(w))}
function pOf(w){return data.progress[w.word]||null}
function isDue(w){const p=pOf(w);return p&&new Date(p.due).getTime()<=Date.now()}
function todayStats(){return data.activity[dayKey()]||{new:0,done:0,correct:0}}
function getStats(){const all=words(), studied=all.filter(w=>pOf(w)), due=filteredWords().filter(isDue).length, mastered=studied.filter(w=>pOf(w).reps>=5).length, today=todayStats();return{all:all.length,studied:studied.length,due,mastered,today}}
function getStreak(){let n=0;let offset=0;if(!(data.activity[dayKey()]?.done>0))offset=-1;while(data.activity[dayKey(offset)]?.done>0){n++;offset--}return n}

function voiceOptions(){return `<option value="">自动优选本地英语声音</option>${LumiAudio.voices().map(v=>`<option value="${escapeHtml(v.voiceURI)}" ${v.voiceURI===data.settings.voice?'selected':''}>${escapeHtml(v.name)} · ${escapeHtml(v.lang)}</option>`).join('')}`}

function notify(msg){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function updateActivity(isNew,quality){const k=dayKey(),t=data.activity[k]||{new:0,done:0,correct:0};if(isNew)t.new++;t.done++;if(quality>=1)t.correct++;data.activity[k]=t}
function mark(word,grade){const old=data.progress[word],first=!old;let p=old?{...old}:{reps:0,interval:0,streak:0,seen:0,lapses:0,firstSeen:dayKey(),due:new Date().toISOString()};p.seen++;p.lastSeen=new Date().toISOString();p.lastGrade=grade;let days=0;if(grade===0){p.reps=0;p.streak=0;p.lapses++;p.interval=0;p.due=new Date(Date.now()+5*60*1000).toISOString()}else if(grade===1){p.streak=0;p.reps=Math.max(1,p.reps);days=1;p.interval=days;p.due=new Date(Date.now()+days*86400000).toISOString()}else{p.reps++;p.streak++;days=p.reps===1?(grade===3?3:1):p.reps===2?(grade===3?6:3):Math.max(5,Math.round((p.interval||3)*(grade===3?2.5:2)));p.interval=days;p.due=new Date(Date.now()+days*86400000).toISOString()}data.progress[word]=p;updateActivity(first,grade);persist()}

function createSession(mode){
  LumiAudio.stop();
  const all=filteredWords(),due=randomize(all.filter(isDue)),newWords=all.filter(w=>!pOf(w));
  const standard=mode==='learn'||mode==='review';
  const newLeft=Math.max(0,data.settings.dailyNew-todayStats().new);
  let selected=[];
  if(mode==='learn')selected=newWords.slice(0,newLeft||5);
  else if(mode==='review')selected=due.slice(0,data.settings.reviewLimit);
  else{const known=randomize(all.filter(pOf));selected=(known.length>=4?known:all).slice(0,data.settings.reviewLimit)}
  const items=selected.map(w=>({word:w.word,type:mode}));
  const queue=LumiStudy.buildQueue(items,standard);
  ui.session={mode,standard,wordTotal:selected.length,queue,index:0,done:0,right:0,wrong:0,wordResults:{}};
  ui.feedback=null;ui.spellValue='';ui.page='study';render();
}
function currentQuestion(){const s=ui.session;return s?.queue[s.index]||null}
function stepAnswer(grade){
  const session=ui.session,question=currentQuestion();if(!session||!question)return;
  const result=LumiStudy.recordAnswer(session,question,grade);if(!result)return;
  if(result.shouldMark)mark(question.word,result.grade);
  LumiAudio.stop();LumiTouch.pulse(grade>=1?'success':'error');
  session.index++;ui.feedback=null;ui.spellValue='';render();
}
function choiceOptions(w){const choices=randomize(filteredWords().filter(v=>v.word!==w.word&&v.zh!==w.zh));let selected=choices.slice(0,3);return randomize([w,...selected])}

function questionHTML(w,q){

    <div class="settingrow"><div><strong>发音方式</strong><small>已内置 ${LumiAudio.count} 个词典真人录音</small></div><select id="audio-source" class="wide"><option value="recording" ${x.audioSource!=='system'?'selected':''}>真人录音优先</option><option value="system" ${x.audioSource==='system'?'selected':''}>系统英语语音</option></select></div>
    <div class="settingrow"><div><strong>系统英语声音</strong><small>例句、自定义词及无录音的词使用此声音</small></div><select id="voice-select" class="wide">${voiceOptions()}</select></div>
    <div class="settingrow"><div><strong>朗读速度</strong><small>正常语速更自然</small></div><select id="speech-rate">${[[.8,'慢速'],[.95,'自然'],[1.1,'稍快']].map(([rate,label])=>`<option value="${rate}" ${Number(x.speechRate)===rate?'selected':''}>${label}</option>`).join('')}</select></div>
    <button class="btn ghost" style="margin-top:14px" data-act="testaudio">♫ 试听当前发音</button>
    <p class="subtle">真人录音随离线资源保存；其余朗读使用本机英语语音。iPhone 可在“设置 → 辅助功能 → 朗读内容（或朗读与语音）→ 声音 → 英语”下载增强或优质声音，下载后回来选择。</p>
    <p class="offline-state" id="offline-ready" role="status" aria-live="polite">${escapeHtml(LumiOffline.message())}</p>
  </div>
  <div class="panel"><h3 class="cardtitle">触感与外观</h3>
    <div class="settingrow"><div><strong>按键触感</strong><small>轻触按钮时反馈；受手机与系统触感设置影响</small></div><select id="haptic-select"><option value="on" ${x.haptics?'selected':''}>开启</option><option value="off" ${!x.haptics?'selected':''}>关闭</option></select></div>
    <button class="btn ghost" style="margin:14px 0" data-act="testhaptic">轻触试一下</button>
    <div class="settingrow"><div><strong>外观</strong></div><select id="theme-select"><option value="light" ${!x.dark?'selected':''}>奶油白</option><option value="dark" ${x.dark?'selected':''}>夜间绿</option></select></div>
  </div>
  <div class="panel"><h3 class="cardtitle">管理单词</h3><button class="btn ghost" data-act="addword">＋ 手动添加单词</button><button class="btn light" style="margin-top:10px" data-act="importcsv">↑ 导入 CSV / TSV 单词表</button><p class="subtle">CSV 第一行可写英文,中文,例句,分类,emoji,等级。导入后可离线学习。</p></div>
  <div class="panel"><h3 class="cardtitle">数据与备份</h3><p class="subtle">学习数据保存在当前设备；请定期导出备份。</p><button class="btn ghost" data-act="export">↓ 导出学习记录 JSON</button><button class="btn light" style="margin-top:10px" data-act="importbackup">↑ 从 JSON 备份恢复</button></div>
  <div class="panel"><h3 class="cardtitle">其他</h3><button class="btn light" data-act="reset" style="color:#b15a4a">清空全部学习记录</button><div class="divider"></div><p class="subtle">lumi叫你背单词 v1.3 · ${BUILT_IN_WORDS.length} 个自带单词 · 离线优先<br><a class="attribution-link" href="./audio/attribution.json" target="_blank" rel="noopener">录音来源与授权</a> · <a class="attribution-link" href="./THIRD-PARTY-NOTICES.txt" target="_blank" rel="noopener">开源说明</a></p></div>
  <input class="hidden" type="file" id="file-import" accept=".csv,.tsv,.txt,.json,text/plain,text/csv,application/json">`;
}
function renderModal(){if(!ui.modal)return '';let content='';if(ui.modal==='detail'){const w=getWord(ui.editing);if(!w)return '';const p=pOf(w);content=`<h2 style="text-align:center">${escapeHtml(w.word)}</h2><div class="emoji">${escapeHtml(w.emoji)}</div><div class="meaning" style="text-align:center">${escapeHtml(w.zh)}</div><p class="example" style="text-align:center">${escapeHtml(w.example)}</p><div class="rowbetween" style="margin-top:20px"><span class="hint">${escapeHtml(w.pack)} · ${levelOf(w)}（参考）</span><button class="smallbutton" data-act="speak" data-word="${escapeHtml(w.word)}">♫ 发音</button></div><p class="subtle">${p?`已练习 ${p.seen} 次 · 下次复习 ${new Date(p.due).toLocaleDateString('zh-CN')}`:'尚未学习'}</p>${data.custom.some(c=>c.word===w.word)?`<button class="btn light" style="margin-top:8px;color:#bd6555" data-act="deleteword" data-word="${escapeHtml(w.word)}">删除自定义单词</button>`:''}`}
if(ui.modal==='addword')content=`<h2>添加一个新单词 🌱</h2><form id="add-form"><label class="field">英文单词<input required id="add-en" placeholder="例如 resilience" autocapitalize="off" autocomplete="off"></label><label class="field">中文释义<input required id="add-zh" placeholder="例如 韧性；复原力"></label><label class="field">英文例句<input id="add-example" placeholder="例如 She showed great resilience."></label><label class="field">词汇等级<select id="add-level"><option value="B1">B1 中级</option><option value="B2" selected>B2 中高级</option><option value="C1">C1 高级</option><option value="C2">C2 高阶</option><option value="A2">A2 基础</option><option value="A1">A1 入门</option></select></label><label class="field">记忆 emoji<input id="add-emoji" placeholder="🌱" maxlength="16"></label><button class="btn" type="submit" style="margin-top:8px">保存到单词本</button></form>`;return `<div class="sheetbackdrop" data-act="close-outer"><div class="sheet"><div class="handle"></div><button class="smallbutton" data-act="close" style="float:right;margin:-3px 0 8px">关闭 ✕</button><div style="clear:both"></div>${content}</div></div>`}
function renderNav(){const pages=[['home','⌂','首页'],['words','▤','单词本'],['stats','▥','统计'],['settings','⚙','设置']];return pages.map(([page,ico,zh])=>`<button data-act="page" data-page="${page}" class="${ui.page===page||ui.page==='study'&&page==='home'?'current':''}" aria-label="${zh}"><span>${ico}</span>${zh}</button>`).join('')}
function render(){document.body.classList.toggle('dark',!!data.settings.dark);document.querySelector('#app').innerHTML=({home:renderHome,study:renderStudy,words:renderWords,stats:renderStats,settings:renderSettings}[ui.page]||renderHome)();document.querySelector('#nav').innerHTML=renderNav();document.querySelector('#overlay').innerHTML=renderModal();LumiTouch.sync(data.settings.haptics)}
function recordAnswer(){const q=currentQuestion();if(!q)return;const w=getWord(q.word),value=String(document.getElementById('spell-answer')?.value||'').trim().toLowerCase();if(!value)return notify('先输入一个答案哦');ui.spellValue=value;ui.feedback={picked:1,correct:value===w.word.toLowerCase()};LumiTouch.pulse(ui.feedback.correct?'success':'error');render()}
function completeQuestion(){const q=currentQuestion();if(!q)return;stepAnswer(ui.feedback?.correct?2:0)}
function parseCSV(src,sep){let rows=[],row=[],field='',quoted=false;for(let i=0;i<src.length;i++){const c=src[i];if(c==='"'){if(quoted&&src[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&src[i+1]==='\n')i++;row.push(field);field='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else field+=c}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSV(txt){const sep=txt.split(/\r?\n/)[0]?.includes('\t')?'\t':',';let rows=parseCSV(txt,sep);let total=0,skipped=0;if(rows[0]&&(/^(英文|单词|word|english|en)$/i).test((rows[0][0]||'').trim()))rows.shift();const existing=new Set(words().map(w=>w.word.toLowerCase()));for(const row of rows){const [en,zh,example,pack,emoji,level]=row.map(s=>s?.trim()||'');if(!en||!zh||!/^[a-zA-Z][a-zA-Z\s'-]*$/.test(en)||existing.has(en.toLowerCase())){skipped++;continue}const w={word:en.toLowerCase(),zh,example:example||`Remember the word ${en}.`,pack:pack||'自定义',emoji:emoji||'🌱',level:LEVELS.includes((level||'').toUpperCase())?level.toUpperCase():'B1'};data.custom.push(w);existing.add(en.toLowerCase());total++}persist();return `${total} 个单词导入成功，跳过 ${skipped} 行`}
async function handleFile(file,kind){if(!file)return;let txt=await file.text();if(kind==='backup'){try{let parsed=JSON.parse(txt);if(!parsed||!parsed.progress||!parsed.activity||!Array.isArray(parsed.custom))throw Error('invalid');if(!confirm('恢复备份会覆盖当前的学习记录。确定继续吗？'))return;data={settings:{...DEFAULTS,...parsed.settings},progress:parsed.progress,activity:parsed.activity,custom:parsed.custom};persist();ui.page='home';ui.session=null;render();notify('学习记录已恢复')}catch(e){notify('备份文件格式不正确')}}else{try{notify(importCSV(txt));render()}catch(e){notify('导入失败，请检查 CSV / TSV 格式')}}}
function exportData(){const contents=JSON.stringify({format:'wordgarden-backup-v1',exportedAt:new Date().toISOString(),...data},null,2);const blob=new Blob([contents],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`lumi叫你背单词-学习备份-${dayKey()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('备份文件已生成，请保存到“文件”App')}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;if(act==='page'){ui.page=el.dataset.page;ui.modal=null;ui.session=null;window.scrollTo(0,0);render()}else if(act==='home'){ui.page='home';ui.session=null;window.scrollTo(0,0);render()}else if(act==='advanced'){data.settings.pack=window.LUMI_ADVANCED_PACK;data.settings.minLevel='C1';persist();createSession('learn');window.scrollTo(0,0)}else if(act==='morewords'){ui.wordLimit=(ui.wordLimit||120)+120;const box=document.querySelector('#word-results');if(box)box.innerHTML=renderWordRows();LumiTouch.sync(data.settings.haptics)}else if(act==='start'){createSession(el.dataset.mode);window.scrollTo(0,0)}else if(act==='speak'){e.stopPropagation();speak(el.dataset.word)}else if(act==='speaksentence'){const word=getWord(el.dataset.word);if(word)speak(word.example)}else if(act==='testaudio'){speak('excerpt',true)}else if(act==='testhaptic'){LumiTouch.pulse();notify(!data.settings.haptics?'请先开启按键触感':LumiTouch.supported?'触感受手机与系统设置影响，可直接感受这次轻触':'当前浏览器没有可用的触感支持')}else if(act==='reveal'){ui.feedback={revealed:true};render()}else if(act==='grade'){stepAnswer(Number(el.dataset.grade))}else if(act==='pick'){const q=currentQuestion();if(!q||ui.feedback?.picked!=null)return;let idx=Number(el.dataset.index);ui.feedback={...ui.feedback,picked:idx,correct:ui.feedback.options[idx]?.word===q.word};if(ui.feedback.correct)speak(q.word);render()}else if(act==='continue'){completeQuestion()}else if(act==='giveup'){ui.feedback={picked:1,correct:false};render()}else if(act==='wordfilter'){ui.listFilter=el.dataset.filter;render()}else if(act==='detail'){ui.modal='detail';ui.editing=el.dataset.word;render()}else if(act==='addword'){ui.modal='addword';render()}else if(act==='close'){ui.modal=null;render()}else if(act==='close-outer'&&e.target===el){ui.modal=null;render()}else if(act==='deleteword'){if(!confirm('确定删除这个自定义单词吗？'))return;data.custom=data.custom.filter(w=>w.word!==el.dataset.word);delete data.progress[el.dataset.word];persist();ui.modal=null;render();notify('单词已删除')}else if(act==='export')exportData();else if(act==='importcsv'||act==='importbackup'){const inp=document.querySelector('#file-import');if(!inp)return;inp.value='';inp.dataset.kind=act==='importbackup'?'backup':'csv';inp.click()}else if(act==='reset'){if(confirm('确定清空所有学习记录吗？此操作无法撤销。建议先导出备份。')){data.progress={};data.activity={};persist();ui.page='home';render();notify('学习记录已清空')}}});
document.addEventListener('submit',e=>{if(e.target.id==='spelling-form'){e.preventDefault();if(ui.feedback?.picked!=null)completeQuestion();else recordAnswer()}if(e.target.id==='add-form'){e.preventDefault();const word=document.querySelector('#add-en').value.trim().toLowerCase(),zh=document.querySelector('#add-zh').value.trim(),example=document.querySelector('#add-example').value.trim(),emoji=document.querySelector('#add-emoji').value.trim()||'🌱';if(!/^[a-z][a-z '-]*$/.test(word)||!zh)return notify('请输入有效英文单词和中文释义');if(words().some(w=>w.word.toLowerCase()===word))return notify('单词本里已经有这个单词啦');data.custom.push({word,zh,example:example||`Remember the word ${word}.`,pack:'自定义',emoji,level:document.querySelector('#add-level')?.value||'B2'});persist();ui.modal=null;render();notify('添加成功 🌱')}});
document.addEventListener('input',e=>{if(e.target.id==='word-search'){ui.search=e.target.value;ui.wordLimit=120;const box=document.querySelector('#word-results');if(box)box.innerHTML=renderWordRows()}if(e.target.id==='spell-answer')ui.spellValue=e.target.value});
document.addEventListener('change',async e=>{const id=e.target.id,value=e.target.value;if(id==='daily-new')data.settings.dailyNew=Number(value);else if(id==='level-select'||id==='level-select-words'){data.settings.minLevel=LEVELS.includes(value)?value:'B1';ui.listFilter='全部';ui.wordLimit=120;}else if(id==='pack-select'||id==='pack-select-words'){data.settings.pack=value;ui.listFilter='全部';ui.wordLimit=120;}else if(id==='sound-select'){data.settings.sound=value==='on';LumiAudio.stop()}else if(id==='audio-source')data.settings.audioSource=value;else if(id==='voice-select')data.settings.voice=value;else if(id==='speech-rate')data.settings.speechRate=Number(value);else if(id==='haptic-select')data.settings.haptics=value==='on';else if(id==='theme-select')data.settings.dark=value==='dark';else if(id==='file-import'){await handleFile(e.target.files?.[0],e.target.dataset.kind);return}else return;persist();render()});
render();
LumiAudio.onVoicesChanged(refreshVoiceChoices);
LumiOffline.onChange(()=>{const el=document.querySelector('#offline-ready');if(el)el.textContent=LumiOffline.message()});
LumiOffline.start();
</script>
